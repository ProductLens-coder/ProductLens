name: Repair Ingredient Detective

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair app.py
        shell: bash
        run: python .github/repair_ingredient.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Ingredient Detective rendering"
          git push
