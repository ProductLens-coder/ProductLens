name: ProductLens ingredient data fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingredient-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch ingredient extraction
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          marker = 'def get_from_open_food_facts(barcode):'
          if marker not in text:
              raise SystemExit('Open Food Facts function not found; refusing unsafe patch.')

          helper = '''def extract_off_ingredients(raw):\n\n    candidates = [\n        raw.get("ingredients_text"),\n        raw.get("ingredients_text_en"),\n        raw.get("ingredients_text_with_allergens"),\n        raw.get("ingredients_text_with_allergens_en")\n    ]\n\n    for value in candidates:\n        if value and str(value).strip():\n            return str(value).strip()\n\n    structured = raw.get("ingredients") or []\n    parts = []\n\n    if isinstance(structured, list):\n        for item in structured:\n            if not isinstance(item, dict):\n                continue\n            name = (\n                item.get("text")\n                or item.get("text_en")\n                or item.get("id")\n                or ""\n            )\n            if name and str(name).strip():\n                parts.append(str(name).strip())\n\n    return ", ".join(parts) if parts else ""\n\n\n'''

          if 'def extract_off_ingredients(raw):' not in text:
              text = text.replace(marker, helper + marker, 1)

          old_assignment = '''        ingredients = raw.get(\n            "ingredients_text",\n            ""\n        ) or ""'''
          if old_assignment not in text:
              raise SystemExit('Expected ingredient assignment not found; refusing unsafe patch.')

          text = text.replace(old_assignment, '        ingredients = extract_off_ingredients(raw)', 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/ingredient-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix robust ingredient extraction [skip ci]"
          git push
